# Pengaturan eksperimen yang benar-benar dipakai pada benchmark utama 15 Nov 2026 (scripts 09-12, 14).
# Parameter metode dan timeout ada di configs/main_benchmark.yaml (beku); profil di configs/resource_profiles.yaml.
random_seed: 2906                 # workload, split dev/test, bootstrap
primary_k: 10
warmup_queries: 0                 # tidak ada warm-up terpisah; efeknya diperiksa pada log stabilitas:
                                  # median latensi ulangan ke-1 18,58 ms vs ulangan ke-2..5 18,42-18,48 ms (< 1 %)
measured_repetitions: 1           # benchmark utama (09, 10, 11)
stability_repetitions: 5          # skrip 12 (REPEATS=5), berurutan satu thread
concurrent_stability:             # skrip 16 (DT-7): dua salinan kueri bersamaan, 4 proses, timeout 700 dan 45 ms
  config: configs/parallel_benchmark.yaml
parallel_throughput: configs/parallel_benchmark.yaml   # skrip 15 (P5): W proses = jumlah core
threads: 1                        # OMP/OPENBLAS/MKL_NUM_THREADS=1
method_order: fixed_per_pair      # tiap pasangan menjalankan semua konfigurasi berurutan (desain berpasangan)
metrics:
  - recall_at_10
  - qps                           # implementasi Python, dihitung dari latensi rata-rata
  - latency_p50_ms
  - latency_p95_ms
  - underfilled_rate
  - visited_nodes
  - distance_comparisons
  - predicate_evaluations
  - stability_overlap             # overlap@k (README bagian 26), ikut turun karena under-fill
  - stability_identical           # proporsi pasangan dengan hasil identik di semua ulangan
statistics:
  paired: true
  bootstrap_iterations: 2000      # src/evaluation/bootstrap.py
  confidence_level: 0.95
freeze_before_heldout:
  - embedding
  - diskann
  - main_benchmark
  - workload
  - resource_profiles
