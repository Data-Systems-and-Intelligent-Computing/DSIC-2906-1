# Dokumentasi metode pencarian. Grid parameter yang dibekukan untuk benchmark utama ada di
# configs/main_benchmark.yaml (frozen: true); nilai di sini mengikuti berkas itu.
k: 10
candidate_budget: [100, 200, 400, 800, 1600, 3200]   # PostFilter, termasuk L x m_max (DT-4)
L_search: [100, 200, 400]                            # TwoHop dan AdaptiveL
timeout_ms: 700                                      # DL-19
methods:
  postfilter:
    enabled: true
  twohop:
    enabled: true
  adaptivel:
    enabled: true
    n_sample: 32           # dev benchmark: harus < jumlah titik dikunjungi (~L); 32 > 64 di semua L
    m_max: 8               # sesuai paper (produksi WebIQ)
  rc_adaptivel:
    enabled: false
    max_visited_nodes: null
    max_distance_comparisons: null
    query_timeout_ms: null
instrumentation:
  visited_nodes: true
  distance_comparisons: true
  predicate_evaluations: true
  returned_count: true
