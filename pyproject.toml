[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsic-2906-filtered-vector-search"
version = "0.1.0"
description = "Controlled adaptation of AdaptiveL for metadata-filtered tourism evidence search"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "psutil>=5.9",
  "matplotlib>=3.9",
  "tqdm>=4.66",
]

[project.optional-dependencies]
embedding = ["sentence-transformers>=3.0"]
test = ["pytest>=8.2", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["src*"]
